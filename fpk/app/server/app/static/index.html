<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Echo 音乐传输 · 飞牛音乐伴侣</title>
  <!--__BASE_TAG__-->
  <link rel="stylesheet" href="static/style.css?v=__APP_VERSION__" />
</head>
<body>
  <div class="app-shell">
    <!-- Left Navigation Rail -->
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-logo" aria-hidden="true">
          <svg viewBox="0 0 40 40" width="34" height="34">
            <defs>
              <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0%" stop-color="#4f8cff"/>
                <stop offset="100%" stop-color="#7c5cff"/>
              </linearGradient>
            </defs>
            <rect width="40" height="40" rx="11" fill="url(#g1)"/>
            <rect x="9" y="8" width="22" height="24" rx="4" fill="rgba(255,255,255,0.16)" stroke="#fff" stroke-width="1.6"/>
            <rect x="12.5" y="11.5" width="15" height="9" rx="2" fill="#fff" fill-opacity="0.92"/>
            <circle cx="20" cy="26.5" r="3.6" fill="none" stroke="#fff" stroke-width="1.8"/>
            <circle cx="20" cy="26.5" r="1.2" fill="#fff"/>
          </svg>
        </div>
        <div class="brand-text">
          <div class="brand-title">Echo 音乐传输</div>
          <div class="brand-sub">依托飞牛音乐 · AIYeon 适配</div>
        </div>
      </div>

      <nav class="nav-list" id="nav-list">
        <div class="nav-section-label">飞牛音乐库</div>
        <button class="nav-item active" data-view="tracks">
          <span class="nav-icon">♪</span>
          <span>全部歌曲</span>
          <span class="nav-badge" id="badge-tracks">--</span>
        </button>
        <button class="nav-item" data-view="albums">
          <span class="nav-icon">◉</span>
          <span>专辑墙</span>
          <span class="nav-badge" id="badge-albums">--</span>
        </button>
        <button class="nav-item" data-view="artists">
          <span class="nav-icon">◎</span>
          <span>歌手库</span>
          <span class="nav-badge" id="badge-artists">--</span>
        </button>
        <button class="nav-item" data-view="favorites">
          <span class="nav-icon">♥</span>
          <span>我喜欢的</span>
          <span class="nav-badge" id="badge-favorites">0</span>
        </button>
        <button class="nav-item" data-view="playlists">
          <span class="nav-icon">☰</span>
          <span>我的歌单</span>
          <span class="nav-badge" id="badge-playlists">0</span>
        </button>
        <button class="nav-item" data-view="folders">
          <span class="nav-icon">▤</span>
          <span>文件夹浏览</span>
        </button>

        <div class="nav-section-label">曲库整理与去重</div>
        <button class="nav-item" data-view="dedup">
          <span class="nav-icon">◈</span>
          <span>智能去重</span>
        </button>
        <button class="nav-item" data-view="organize">
          <span class="nav-icon">▤</span>
          <span>曲库整理</span>
        </button>
        <button class="nav-item" data-view="recycle">
          <span class="nav-icon">♻</span>
          <span>安全回收站</span>
          <span class="nav-badge hidden" id="badge-recycle">0</span>
        </button>

        <div class="nav-section-label">Echo 播放器</div>
        <button class="nav-item" data-view="device">
          <span class="nav-icon">▣</span>
          <span>Echo 存储管理</span>
        </button>
        <button class="nav-item" data-view="transfers">
          <span class="nav-icon">⇅</span>
          <span>传输任务与日志</span>
          <span class="nav-badge accent hidden" id="badge-transfer-active">传输中</span>
        </button>
        <button class="nav-item" data-view="settings">
          <span class="nav-icon">⚙</span>
          <span>传输设置</span>
        </button>
      </nav>

      <div class="sidebar-footer">
        <div class="user-picker-row">
          <label for="user-select">飞牛音乐用户</label>
          <select id="user-select"></select>
        </div>
        <div class="stat-mini" id="sidebar-stats">正在连接飞牛音乐库...</div>
      </div>
    </aside>

    <!-- Main Workspace -->
    <div class="main-area">
      <!-- Top Header -->
      <header class="topbar">
        <div class="search-box">
          <span class="search-icon">⌕</span>
          <input type="text" id="global-search" placeholder="搜索飞牛音乐：歌名、歌手、专辑、文件名..." autocomplete="off" />
          <button class="clear-search hidden" id="clear-search" title="清空搜索">✕</button>
        </div>

        <div class="device-bar" id="device-bar">
          <span class="status-dot offline" id="device-dot"></span>
          <select id="device-select" title="选择目标 Echo 外挂存储"></select>
          <span class="device-space" id="device-space">未检测到外挂存储</span>
          <button class="btn btn-ghost btn-sm" id="btn-refresh-devices" title="重新扫描 /vol00 外挂设备">刷新</button>
          <button class="btn btn-ghost btn-sm" id="btn-sync-disk" title="刷新磁盘缓存，安全拔出 USB 前建议点击">安全刷盘</button>
        </div>
      </header>

      <!-- Active Transfer Banner (Visible when running) -->
      <div class="transfer-banner hidden" id="transfer-banner">
        <div class="tb-left">
          <div class="tb-spinner"></div>
          <div class="tb-info">
            <div class="tb-title" id="tb-title">正在发送到 Echo...</div>
            <div class="tb-sub" id="tb-sub">准备中...</div>
          </div>
        </div>
        <div class="tb-progress-wrap">
          <div class="tb-progress-bar"><div class="tb-progress-fill" id="tb-fill"></div></div>
          <span class="tb-pct" id="tb-pct">0%</span>
        </div>
        <div class="tb-actions">
          <button class="btn btn-ghost btn-sm" id="btn-open-transfer-view">查看详情</button>
          <button class="btn btn-danger btn-sm" id="btn-cancel-transfer">取消</button>
        </div>
      </div>

      <!-- View Container -->
      <main class="content-scroll" id="content-area">
        <div class="loading-state">正在加载飞牛音乐数据库...</div>
      </main>
    </div>
  </div>

  <!-- Floating Selection Dock -->
  <div class="selection-dock hidden" id="selection-dock">
    <div class="dock-left">
      <span class="dock-count" id="dock-count">已选 0 首</span>
      <span class="dock-size" id="dock-size">0 MB</span>
      <span class="dock-hint" id="dock-hint">自动携带飞牛刮削封面 + LRC 歌词</span>
    </div>
    <div class="dock-actions">
      <button class="btn btn-ghost btn-sm" id="btn-clear-selection">清空选择</button>
      <button class="btn btn-primary" id="btn-send-selected">🚀 发送到 Echo</button>
    </div>
  </div>

  <!-- Track Detail Drawer -->
  <div class="drawer-backdrop hidden" id="drawer-backdrop"></div>
  <aside class="detail-drawer hidden" id="detail-drawer">
    <div class="drawer-header">
      <div class="drawer-title">曲目详情与刮削信息</div>
      <button class="btn btn-ghost btn-sm" id="btn-close-drawer">✕</button>
    </div>
    <div class="drawer-body" id="drawer-body"></div>
  </aside>

  <!-- Toast Container -->
  <div class="toast-container" id="toast-container"></div>

  <script src="static/app.js?v=__APP_VERSION__"></script>
</body>
</html>
